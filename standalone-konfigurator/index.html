<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ballz Trikot-Konfigurator – Standalone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Oswald:wght@400;600;700&family=Bebas+Neue&family=Anton&family=Teko:wght@500;700&family=Archivo+Black&family=Montserrat:wght@600;800&family=Russo+One&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --panel-2: #1a2434;
    --line: #263243;
    --text: #e7ecf3;
    --muted: #8c9bb0;
    --primary: #ff5a1f;
    --primary-2: #ff7a45;
    --accent: #3b82f6;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #17203000, #0b0f17 60%), var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: rgba(19,26,38,0.7); backdrop-filter: blur(8px);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .5px; font-size: 18px; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: grid; place-items: center; font-size: 18px;
  }
  .logo small { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; }
  header .spacer { flex: 1; }
  .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }

  /* Main layout */
  .main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  @media (max-width: 980px) {
    .app { height: auto; min-height: 100vh; }
    .main { grid-template-columns: 1fr; }
    .stage { padding: 14px 12px 4px; overflow: visible; }
    .stage-toolbar { flex-wrap: wrap; justify-content: center; max-width: 100%; }
    .seg { padding: 7px 12px; font-size: 12px; }
    .jersey-wrap { width: min(340px, 78%); margin-top: 2px; }
    .jersey-wrap.sheet { width: 97%; }
    .sidebar { border-left: none; border-top: 1px solid var(--line); }
    .tabs { position: sticky; top: 0; background: var(--panel); z-index: 6; overflow-x: visible; }
    .tab { flex: 1 1 0; min-width: 0; padding: 11px 3px; font-size: 11px; gap: 3px; flex-direction: column; }
    .tab svg { width: 17px; height: 17px; }
    .panel-body { overflow: visible; }
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  .stage-toolbar { display: flex; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 5px; border-radius: 999px; z-index: 5; margin-bottom: 8px; }
  .seg { border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .seg.active { background: var(--primary); color: #fff; }
  .jersey-wrap { width: min(500px, 78%); aspect-ratio: 1000 / 950; margin-top: 4px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.5)); }
  .jersey-wrap.sheet { width: min(760px, 96%); }
  .jersey-wrap.threed { width: min(460px, 74%); aspect-ratio: 4 / 5; filter: none; }
  .jersey-wrap.threed #preview, .jersey-wrap.threed canvas { width: 100%; height: 100%; }
  #gl3d { display: block; border-radius: 16px; cursor: grab; touch-action: none;
    background:
      radial-gradient(52% 14% at 50% 90%, rgba(0,0,0,.34), transparent 72%),
      radial-gradient(125% 120% at 50% 16%, #eaeef4, #cbd4e0 52%, #aab5c6 100%); }
  #gl3d:active { cursor: grabbing; }
  .gl-hint { margin-top: 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
  svg.jersey { width: 100%; height: 100%; display: block; }
  .zone-hit { cursor: pointer; }
  .zone-outline { fill: none; stroke: var(--accent); stroke-dasharray: 6 5; stroke-width: 2.5; opacity: 0; transition: opacity .15s; }
  .zone-hit:hover .zone-outline { opacity: .7; }
  .zone-hit.selected .zone-outline { opacity: 1; stroke: var(--primary); stroke-dasharray: none; }
  .zone-empty-bg { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.25); stroke-dasharray: 5 5; stroke-width: 2; }
  .zone-label { fill: var(--muted); font: 700 22px "Inter", sans-serif; }
  .stage-caption { margin-top: 14px; color: var(--muted); font-size: 12px; }

  /* Sidebar */
  .sidebar { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { flex: 1; min-width: max-content; border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 12.5px; padding: 12px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; justify-content: center; }
  .tab.active { color: var(--text); border-bottom-color: var(--primary); }
  .tab svg { width: 15px; height: 15px; }
  .panel-body { padding: 18px; overflow-y: auto; flex: 1; }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 800; margin: 4px 0 12px; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  input[type="text"], select, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 9px; font-size: 13.5px; font-family: inherit; outline: none;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--primary); }
  input[type="range"] { width: 100%; accent-color: var(--primary); }

  .card-tpl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tpl { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; transition: .15s; }
  .tpl:hover { border-color: #3a4a60; }
  .tpl.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .tpl .ic { font-size: 22px; }
  .tpl .nm { font-weight: 700; font-size: 13px; margin-top: 6px; }
  .tpl .sp { font-size: 11px; color: var(--muted); }

  .part-row { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: var(--panel-2); }
  .swatch { width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255,255,255,.15); cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; }
  .swatch input { position: absolute; inset: -6px; opacity: 0; cursor: pointer; }
  .part-meta { flex: 1; min-width: 0; }
  .part-meta .pn { font-weight: 700; font-size: 13px; }
  .cmyk { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .preset { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); cursor: pointer; padding: 0; }

  .zone-item { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--panel-2); }
  .zone-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer; }
  .zone-head .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: rgba(255,255,255,.06); padding: 2px 7px; border-radius: 999px; }
  .zone-head .zt { font-weight: 700; font-size: 13px; flex: 1; }
  .zone-body { padding: 0 12px 14px; border-top: 1px solid var(--line); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mini-label { font-size: 11px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .color-input { display: flex; align-items: center; gap: 8px; }
  .color-input input[type=color] { width: 34px; height: 34px; border: none; background: none; padding: 0; border-radius: 8px; cursor: pointer; }
  .auto-tag { font-size: 10.5px; color: var(--accent); background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.3); padding: 2px 7px; border-radius: 999px; }

  table.players { width: 100%; border-collapse: collapse; }
  table.players th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 6px 6px; }
  table.players td { padding: 4px 4px; }
  table.players input { padding: 7px 8px; font-size: 12.5px; }
  table.players input.num { width: 52px; text-align: center; }
  .prow.active td input { border-color: var(--primary); }
  .radio-cell { width: 26px; text-align: center; }
  .del-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px; }
  .del-btn:hover { color: #ff6b6b; background: rgba(255,107,107,.1); }

  button.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 10px; font-weight: 700; font-size: 13.5px; padding: 11px 16px; cursor: pointer; }
  button.btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; width: 100%; }
  button.btn.primary:hover { filter: brightness(1.05); }
  button.btn.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  button.btn.ghost:hover { border-color: #3a4a60; }
  .btn-full { width: 100%; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .upload-zone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .upload-zone:hover { border-color: var(--primary); color: var(--text); }
  .divider { height: 1px; background: var(--line); margin: 18px 0; }
  .rules-box { border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); padding: 12px 13px; }
  .rules-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 9px; }
  .rules-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; text-transform: none; letter-spacing: 0; }
  .rules-badge.ok { background: rgba(22,163,74,.16); color: #4ade80; border: 1px solid rgba(22,163,74,.35); }
  .rules-badge.warn { background: rgba(245,158,11,.16); color: #fbbf24; border: 1px solid rgba(245,158,11,.4); }
  .rule-row { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 12.5px; }
  .rule-ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 900; flex-shrink: 0; }
  .rule-ic.ok { background: rgba(22,163,74,.18); color: #4ade80; }
  .rule-ic.warn { background: rgba(245,158,11,.18); color: #fbbf24; }
  .rule-lbl { flex: 1; color: var(--text); }
  .rule-val { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
  .rule-val.warn { color: #fbbf24; }
  .rules-src { font-size: 10.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .swatch-preview-img { width: 100%; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <span class="mark">🏀</span>
      <div>Ballz <small>Trikot-Konfigurator</small></div>
    </div>
    <div class="spacer"></div>
    <span class="pill">Standalone Demo · Mock-Daten · kein Backend</span>
  </header>

  <div class="main">
    <!-- Preview stage -->
    <div class="stage">
      <div class="stage-toolbar">
        <button class="seg" data-view="front">Vorderteil</button>
        <button class="seg" data-view="back">Rückteil</button>
        <button class="seg" data-view="mockup">Vorschau</button>
        <button class="seg" data-view="sheet">Schnittbogen</button>
      </div>
      <div class="jersey-wrap">
        <div id="preview"></div>
      </div>
      <div class="stage-caption" id="caption"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tabs" id="tabs"></div>
      <div class="panel-body" id="panel"></div>
    </aside>
  </div>
</div>

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  return { r: parseInt(hex.slice(0,2),16), g: parseInt(hex.slice(2,4),16), b: parseInt(hex.slice(4,6),16) };
}
function rgbToCmyk(r, g, b) {
  const rn=r/255, gn=g/255, bn=b/255;
  const k = 1 - Math.max(rn, gn, bn);
  if (k === 1) return { c:0, m:0, y:0, k:100 };
  return {
    c: Math.round((1-rn-k)/(1-k)*100),
    m: Math.round((1-gn-k)/(1-k)*100),
    y: Math.round((1-bn-k)/(1-k)*100),
    k: Math.round(k*100),
  };
}
function hexToCmyk(hex) { const {r,g,b} = hexToRgb(hex); return rgbToCmyk(r,g,b); }
function formatCmyk(c) { return `C${c.c} M${c.m} Y${c.y} K${c.k}`; }
function initials(name) {
  return (name||'').trim().split(/\s+/).map(w => w[0]||'').join('').slice(0,3).toUpperCase();
}

// Prüft die aktuellen Nummern-Zonen (Höhe in cm aus Maßtabelle) gegen die Regeln
function ruleChecks() {
  const t = tpl(), s = sizeSpec(), r = SPORT_RULES[t.sport];
  if (!r) return null;
  const fZ = t.zones.front.find(z => z.purpose === "playerNumber");
  const bZ = t.zones.back.find(z => z.purpose === "playerNumber");
  const bCm = bZ ? +(bZ.rh * s.len).toFixed(1) : 0;
  const fCm = fZ ? +(fZ.rh * s.len).toFixed(1) : 0;
  const checks = [
    { ok: bCm >= r.backMin,  label:`Rückennummer ≥ ${r.backMin} cm`, val:`${bCm} cm` },
    { ok: !r.frontReq || fCm >= r.frontMin, label:`Brustnummer ≥ ${r.frontMin} cm${r.frontReq?"":" (optional)"}`, val:`${fCm} cm` },
  ];
  const num = parseInt(selPlayer()?.number, 10);
  if (!isNaN(num)) checks.push({ ok: num>=r.range[0] && num<=r.range[1], label:`Nummer ${r.range[0]}–${r.range[1]}`, val:`#${num}` });
  return { checks, src:r.src, sport:t.sport };
}

/* ---------- Schnitt-Geometrie (maßstabsgetreu nach Maßtabelle, Basis L) ----------
   Alle Teile werden flach gezeichnet – so, wie sie sublimiert und dann vernäht
   werden. Vorder-/Rückteil sind exakt auf Länge × Brustbreite (cm) skaliert. */
const P = (x,y) => `${x.toFixed(1)} ${y.toFixed(1)}`;

// Flaches Vorder-/Rückteil aus cm-Maßen (Schulter, Halsausschnitt, Achsel, Saum)
// o: { neckD (Anteil Höhe), shoulder/neckW (Anteil Breite), armhole (Anteil Höhe) }
function flatPanel(b, o) {
  const {x:X,y:Y,w:W,h:H} = b;
  const cx = X + W/2, top = Y + 0.012*H;
  const shH = o.shoulder*W/2, neH = o.neckW*W/2, chH = 0.5*W, hemH = 0.49*W;
  const nD = o.neckD*H, arm = o.armhole*H;
  return `M ${P(cx-shH, top)}`
    + ` L ${P(cx-neH, Y)}`
    + ` Q ${P(cx, Y+nD)} ${P(cx+neH, Y)}`
    + ` L ${P(cx+shH, top)}`
    + ` Q ${P(cx+chH, Y+arm*0.5)} ${P(cx+chH, Y+arm)}`
    + ` L ${P(cx+hemH, Y+H)}`
    + ` Q ${P(cx, Y+H+0.02*H)} ${P(cx-hemH, Y+H)}`
    + ` L ${P(cx-chH, Y+arm)}`
    + ` Q ${P(cx-chH, Y+arm*0.5)} ${P(cx-shH, top)} Z`;
}
function panelOpts(view, isTank) {
  if (isTank) return { neckD: view==="front"?0.15:0.05, shoulder:0.34, neckW:0.34, armhole:0.40 };
  return { neckD: view==="front"?0.11:0.04, shoulder:0.80, neckW:0.33, armhole:0.29 };
}
// Ärmel-Zuschnitt (Ärmelkugel): oben leicht gewölbt, unten runde Kappe
function sleevePiece(b) {
  const {x:X,y:Y,w:W,h:H} = b;
  return `M ${P(X, Y+0.24*H)} Q ${P(X+0.5*W, Y-0.04*H)} ${P(X+W, Y+0.24*H)}`
    + ` L ${P(X+0.90*W, Y+0.52*H)} Q ${P(X+0.5*W, Y+1.06*H)} ${P(X+0.10*W, Y+0.52*H)} Z`;
}
function bandPiece(b) {
  const {x:X,y:Y,w:W,h:H} = b;
  return `M ${P(X, Y+0.25*H)} L ${P(X+W, Y)} L ${P(X+W, Y+0.75*H)} L ${P(X, Y+H)} Z`;
}
function neckPiece(b) {
  const {x:X,y:Y,w:W,h:H} = b;
  return `M ${P(X, Y+0.10*H)} L ${P(X+W, Y)} L ${P(X+W, Y+H)} L ${P(X, Y+0.90*H)} Z`;
}
// Maßlinie (Doppelpfeil mit cm-Beschriftung)
function dim(x1,y1,x2,y2,label) { return { x1,y1,x2,y2, label }; }

// Baut die komplette Szene für eine Ansicht: front | back | sheet | mockup
function buildScene(view) {
  const t = tpl(), isTank = t.style === "tank", s = sizeSpec();
  const ratio = s.len / s.chest;               // Höhe/Breite exakt aus Maßtabelle

  if (view === "front" || view === "back") {
    const CM = 9, pw = s.chest*CM, ph = s.len*CM;
    const padX = 150, padTop = 64, padBottom = 96;
    const bb = { x:padX, y:padTop, w:pw, h:ph };
    const o = panelOpts(view, isTank);
    return {
      vbW: pw + padX*2, vbH: ph + padTop + padBottom,
      pieces: [{ key:view, d:flatPanel(bb, o), colorKey:view }],
      zones: t.zones[view].map(z => ({ z, bb })),
      labels: [{ text: view==="front"?"Vorderteil":"Rückteil", x:bb.x+bb.w/2, y:bb.y-28, size:26 }],
      dims: state.showDims ? [
        dim(bb.x-42, bb.y, bb.x-42, bb.y+bb.h, `Länge ${s.len} cm`),
        dim(bb.x, bb.y+bb.h+42, bb.x+bb.w, bb.y+bb.h+42, `Brustbreite ${s.chest} cm`),
      ] : [],
    };
  }

  // Schnittbogen: alle Zuschnitt-Teile nebeneinander (wie der Druckbogen)
  const PW = 350, PH = PW*ratio;               // Panelbreite fix, Höhe maßstäblich
  const frontBB = { x:50,  y:150, w:PW, h:PH };
  const backBB  = { x:50+PW+70, y:150, w:PW, h:PH };
  const colX = 895;                            // rechte Spalte: Ärmel, Bündchen, Kragen
  const rBandBB = { x:colX+6, y:150, w:230, h:44 };
  const rArmBB  = { x:colX,   y:210, w:242, h:150 };
  const lBandBB = { x:colX+6, y:388, w:230, h:44 };
  const lArmBB  = { x:colX,   y:448, w:242, h:150 };
  const neckBB  = { x:colX+6, y:632, w:230, h:44 };
  const oF = panelOpts("front", isTank), oB = panelOpts("back", isTank);
  const pieces = [
    { key:"front", d:flatPanel(frontBB, oF), colorKey:"front" },
    { key:"back",  d:flatPanel(backBB,  oB), colorKey:"back" },
  ];
  const labels = [
    { text:"Vorderteil", x:frontBB.x+frontBB.w/2, y:frontBB.y-16, size:22 },
    { text:"Rückteil",   x:backBB.x+backBB.w/2,   y:backBB.y-16,  size:22 },
  ];
  const dims = state.showDims ? [
    dim(frontBB.x-36, frontBB.y, frontBB.x-36, frontBB.y+frontBB.h, `${s.len} cm`),
    dim(frontBB.x, frontBB.y+frontBB.h+34, frontBB.x+frontBB.w, frontBB.y+frontBB.h+34, `Brustbreite ${s.chest} cm`),
  ] : [];
  let bottom = frontBB.y + frontBB.h + 60;
  if (!isTank) {
    pieces.push(
      { key:"rArm",  d:sleevePiece(rArmBB), colorKey:"sleeveR" },
      { key:"lArm",  d:sleevePiece(lArmBB), colorKey:"sleeveL" },
      { key:"rBand", d:bandPiece(rBandBB),  colorKey:"band" },
      { key:"lBand", d:bandPiece(lBandBB),  colorKey:"band" },
    );
    labels.push(
      { text:"Ärmelbündchen R", x:rBandBB.x+rBandBB.w/2, y:rBandBB.y-8, size:16 },
      { text:"Ärmel rechts",    x:rArmBB.x+rArmBB.w/2,   y:rArmBB.y-8,  size:16 },
      { text:"Ärmelbündchen L", x:lBandBB.x+lBandBB.w/2, y:lBandBB.y-8, size:16 },
      { text:"Ärmel links",     x:lArmBB.x+lArmBB.w/2,   y:lArmBB.y-8,  size:16 },
    );
    if (state.showDims) dims.push(dim(rArmBB.x+rArmBB.w*0.16, rArmBB.y+rArmBB.h*0.14, rArmBB.x+rArmBB.w*0.84, rArmBB.y+rArmBB.h*0.60, `Arm ${s.arm} cm`));
  }
  const nBB = isTank ? { x:colX+6, y:210, w:230, h:44 } : neckBB;
  pieces.push({ key:"neck", d:neckPiece(nBB), colorKey:"neck" });
  labels.push({ text:"Kragen", x:nBB.x+nBB.w/2, y:nBB.y-8, size:16 });
  const zones = [
    ...t.zones.front.map(z => ({ z, bb:frontBB })),
    ...t.zones.back.map(z => ({ z, bb:backBB })),
  ];
  const vbH = Math.max(bottom, (isTank ? nBB.y+nBB.h : lArmBB.y+lArmBB.h), nBB.y+nBB.h) + 40;
  return { vbW:1200, vbH, pieces, zones, labels, dims };
}

/* =========================================================================
   PREVIEW (SVG)
   ========================================================================= */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Maßlinie als SVG (Doppelpfeil, Endkappen, cm-Label mit Hintergrund)
function renderDim(d) {
  const { x1,y1,x2,y2,label } = d;
  const len = Math.hypot(x2-x1, y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len, px=-uy, py=ux, s=13;
  const head = (tx,ty,dx,dy) => `<path d="M ${P(tx-dx*s+px*s*0.55, ty-dy*s+py*s*0.55)} L ${P(tx,ty)} L ${P(tx-dx*s-px*s*0.55, ty-dy*s-py*s*0.55)}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const cap = (x,y) => `<line x1="${(x+px*8).toFixed(1)}" y1="${(y+py*8).toFixed(1)}" x2="${(x-px*8).toFixed(1)}" y2="${(y-py*8).toFixed(1)}" stroke="#3b82f6" stroke-width="2"/>`;
  const fs = 22, midX=(x1+x2)/2, midY=(y1+y2)/2, vertical = Math.abs(uy) > Math.abs(ux);
  const w = label.length*fs*0.56 + 14, h = fs+8;
  const g = `<g transform="translate(${(midX + (vertical?-14:0)).toFixed(1)} ${(midY + (vertical?0:-13)).toFixed(1)}) rotate(${vertical?-90:0})">`
    + `<rect x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="5" fill="#0b0f17" opacity="0.82"/>`
    + `<text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#8fbcff" font-family="Inter,sans-serif" font-weight="800" font-size="${fs}">${esc(label)}</text></g>`;
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3b82f6" stroke-width="2.5"/>`
    + head(x2,y2,ux,uy) + head(x1,y1,-ux,-uy) + cap(x1,y1) + cap(x2,y2) + g;
}

/* ---------- Realistische Trikot-Vorschau (2D-Illustration) ---------- */
// Farbe aufhellen/abdunkeln (amt: -1..1)
function shade(hex, amt) {
  const { r, g, b } = hexToRgb(hex);
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  const m = v => Math.round(v + (f - v) * p);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
// Ein Trikot (Vorder- oder Rückseite) als schattierte Illustration
function jerseyArt(side, ox, oy, s) {
  const c = state.partColors;
  const T = (x,y) => `${(ox+x*s).toFixed(1)} ${(oy+y*s).toFixed(1)}`;
  const nd = side === "front" ? 100 : 74;
  const body = `M ${T(112,70)} L ${T(150,60)} Q ${T(190,nd)} ${T(230,60)} L ${T(268,70)}`
    + ` C ${T(300,84)} ${T(318,120)} ${T(322,168)} C ${T(326,262)} ${T(320,360)} ${T(312,452)}`
    + ` Q ${T(190,472)} ${T(68,452)} C ${T(60,360)} ${T(54,262)} ${T(58,168)}`
    + ` C ${T(62,120)} ${T(80,84)} ${T(112,70)} Z`;
  const slL = `M ${T(112,70)} C ${T(84,78)} ${T(44,96)} ${T(26,128)} C ${T(18,150)} ${T(22,181)} ${T(34,203)} L ${T(93,190)} C ${T(83,150)} ${T(88,104)} ${T(112,70)} Z`;
  const slR = `M ${T(268,70)} C ${T(296,78)} ${T(336,96)} ${T(354,128)} C ${T(362,150)} ${T(358,181)} ${T(346,203)} L ${T(287,190)} C ${T(297,150)} ${T(292,104)} ${T(268,70)} Z`;
  const cuffL = `M ${T(33,203)} L ${T(93,190)} L ${T(98,211)} L ${T(38,224)} Z`;
  const cuffR = `M ${T(347,203)} L ${T(287,190)} L ${T(282,211)} L ${T(342,224)} Z`;
  const collar = `M ${T(146,58)} Q ${T(190,nd)} ${T(234,58)} L ${T(238,77)} Q ${T(190,nd+19)} ${T(142,77)} Z`;
  const hem = `M ${T(66,449)} Q ${T(190,470)} ${T(314,449)} L ${T(316,470)} Q ${T(190,491)} ${T(64,470)} Z`;

const cutCache = {};

function fillForPart(g, part, key, w, h) {
  const hex = state.partColors[key], pat = (state.partPattern||{})[key] || "solid";
  if (pat === "streifen") { const p=document.createElement("canvas"); p.width=p.height=22; const pg=p.getContext("2d");

             font-family="'${esc(zoneFont(z))}','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="${zoneWeight(z)}"
             font-size="${fontPx}" fill="${zoneColor(z)}"
             style="paint-order:stroke; stroke:#00000030; stroke-width:${fontPx*0.03}px;">${esc(txt)}</text>`;
  } else {
    content = `<rect class="zone-empty-bg" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>
               <text class="zone-label" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central">${esc(z.label)}</text>`;
  }

  return `<g class="zone-hit${selected}" data-zone="${z.id}">
            ${content}

          </g>`;
}

/* =========================================================================
   EVENT-WIRING
   ========================================================================= */
function wirePanel() {
  // Vorlage
  document.querySelectorAll("[data-tpl]").forEach(b => b.addEventListener("click", () => {
    const t = TEMPLATES.find(x => x.id === b.dataset.tpl);
    state.templateId = t.id;
    state.partColors = { ...t.colors };
    state.zoneContent = {};
    state.selectedZoneId = null;
    renderPreview(); renderPanel();
  }));
  bindText("clubName", v => { state.clubName = v; renderPreview(); });
  wireUpload("clubLogoUp", dataUrl => { state.clubLogo = dataUrl; renderPreview(); renderPanel(); });
  const sizeSel = document.getElementById("sizeSel");
  if (sizeSel) sizeSel.addEventListener("change", e => { state.size = e.target.value; renderPreview(); renderPanel(); });
  const dimsT = document.getElementById("dimsToggle");
  if (dimsT) dimsT.addEventListener("change", e => { state.showDims = e.target.checked; renderPreview(); });

  // Farben
  document.querySelectorAll("[data-partcolor]").forEach(inp => inp.addEventListener("input", e => {
    state.partColors[inp.dataset.partcolor] = e.target.value;
    renderPreview();
    // CMYK-Anzeige aktualisieren ohne Fokusverlust der Farbwähler
    const row = inp.closest(".part-row"); const col = e.target.value;
    row.querySelector(".swatch").style.background = col;
    row.querySelector(".cmyk").textContent = col.toUpperCase() + " · " + formatCmyk(hexToCmyk(col));
  }));
  document.querySelectorAll(".preset[data-part]").forEach(b => b.addEventListener("click", () => {
    state.partColors[b.dataset.part] = b.dataset.col; renderPreview(); renderPanel();
  }));
  document.querySelectorAll("[data-partpat]").forEach(s => s.addEventListener("change", e => {
    state.partPattern[s.dataset.partpat] = e.target.value; renderPreview();
  }));

  // Zonen
  document.querySelectorAll("[data-zonehead]").forEach(h => h.addEventListener("click", () => {
    const id = h.dataset.zonehead;
    state.selectedZoneId = state.selectedZoneId === id ? null : id;
    renderPreview(); renderPanel();
  }));
  document.querySelectorAll("[data-zonetext]").forEach(inp => inp.addEventListener("input", e => {
    ensureZC(inp.dataset.zonetext).text = e.target.value; renderPreview();
  }));
  document.querySelectorAll("[data-zonefont]").forEach(s => s.addEventListener("change", e => {
    ensureZC(s.dataset.zonefont).font = e.target.value; renderPreview();
  }));
  document.querySelectorAll("[data-zoneweight]").forEach(s => s.addEventListener("change", e => {
    ensureZC(s.dataset.zoneweight).weight = e.target.value; renderPreview();
  }));
  document.querySelectorAll("[data-zonesize]").forEach(s => s.addEventListener("input", e => {
    ensureZC(s.dataset.zonesize).size = parseFloat(e.target.value); renderPreview();
  }));
  document.querySelectorAll("[data-zonecolor]").forEach(s => s.addEventListener("input", e => {
    ensureZC(s.dataset.zonecolor).color = e.target.value; renderPreview();
    const span = s.parentElement.querySelector(".cmyk");
    if (span) span.textContent = e.target.value.toUpperCase() + " · " + formatCmyk(hexToCmyk(e.target.value));
  }));
  document.querySelectorAll("[data-zoneup]").forEach(z => wireUploadEl(z, dataUrl => {
    ensureZC(z.dataset.zoneup).imageDataUrl = dataUrl; renderPreview(); renderPanel();
  }));

  // Team
  document.querySelectorAll("[data-selp]").forEach(r => r.addEventListener("change", () => {
    state.selectedPlayer = parseInt(r.dataset.selp); renderPreview(); renderPanel();
  }));
  document.querySelectorAll("[data-pnum]").forEach(inp => inp.addEventListener("input", e => {
    state.players[inp.dataset.pnum].number = e.target.value; renderPreview();
  }));
  document.querySelectorAll("[data-pname]").forEach(inp => inp.addEventListener("input", e => {
    state.players[inp.dataset.pname].name = e.target.value; renderPreview();
  }));
  document.querySelectorAll("[data-psize]").forEach(s => s.addEventListener("change", e => {
    state.players[s.dataset.psize].size = e.target.value;
  }));
  document.querySelectorAll("[data-pdel]").forEach(b => b.addEventListener("click", () => {
    const i = parseInt(b.dataset.pdel); state.players.splice(i,1);
    if (state.selectedPlayer >= state.players.length) state.selectedPlayer = Math.max(0, state.players.length-1);
    renderPreview(); renderPanel();
  }));
  const add = document.getElementById("addPlayer");
  if (add) add.addEventListener("click", () => {
    state.players.push({ number:"", name:"", size:"L" }); renderPanel();
  });

  // Export
  bindClick("exportPng", () => exportPng(state.view));
  bindClick("exportSheet", () => exportPng("sheet"));
  bindClick("resetAll", () => {
    const t = tpl(); state.partColors = {...t.colors}; state.zoneContent = {}; state.selectedZoneId = null;
    renderPreview(); renderPanel();
  });
}

function ensureZC(id) { return (state.zoneContent[id] = state.zoneContent[id] || {}); }
function bindText(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("input", e => fn(e.target.value)); }
function bindClick(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); }

function wireUpload(id, cb) { const el = document.getElementById(id); if (el) wireUploadEl(el, cb); }
function wireUploadEl(el, cb) {
  el.addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => cb(rd.result); rd.readAsDataURL(f);
    };
    inp.click();
  });
}

/* =========================================================================
   PNG-EXPORT (Canvas — nutzt geladene Fonts via document.fonts)
   ========================================================================= */
// Rastert die aktuelle Vorschau-SVG in ein PNG (für die Trikot-Vorschau)
async function exportSvgPreview() {
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  if (state.view !== "mockup") renderJerseyPreview();
  const svg = document.querySelector("#preview svg"); if (!svg) return;
  const xml = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml); });
  const S = 2, canvas = document.createElement("canvas"); canvas.width = 900*S; canvas.height = 560*S;
  const ctx = canvas.getContext("2d"); ctx.fillStyle = "#0b0f17"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const a = document.createElement("a"); a.href = canvas.toDataURL("image/png");
  a.download = `${tpl().id}_gr${state.size}_vorschau.png`; a.click();
}

async function exportPng(view) {
  if (view === "mockup") { await exportSvgPreview(); return; }
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  const SCALE = 2;
  const t = tpl();
  const scene = buildScene(view);
  const c = state.partColors;
  const canvas = document.createElement("canvas");
  canvas.width = scene.vbW*SCALE; canvas.height = scene.vbH*SCALE;
  const ctx = canvas.getContext("2d");
  ctx.scale(SCALE, SCALE);

  // Sheen-Verlauf (Mockup-Stoffschattierung)
  let sheen = null;
  if (scene.mockup) {
    sheen = ctx.createLinearGradient(0,0,0,scene.vbH);
    sheen.addColorStop(0, "rgba(255,255,255,0.20)"); sheen.addColorStop(0.32, "rgba(255,255,255,0.04)");
    sheen.addColorStop(0.62, "rgba(0,0,0,0.02)"); sheen.addColorStop(1, "rgba(0,0,0,0.18)");
  }
  // Zuschnitt-Teile
  for (const pc of scene.pieces) {
    const path = new Path2D(pc.d);
    ctx.fillStyle = c[pc.colorKey]; ctx.fill(path);
    ctx.strokeStyle = "#00000030"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke(path);
    if (pc.grad && sheen) { ctx.fillStyle = sheen; ctx.fill(path); }
  }
  // Nähte
  for (const d of (scene.seams||[])) { ctx.strokeStyle = "#00000026"; ctx.lineWidth = 2.5; ctx.stroke(new Path2D(d)); }
  // Teile-Beschriftung
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#8c9bb0";
  for (const l of (scene.labels||[])) { ctx.font = `700 ${l.size}px Inter, sans-serif`; ctx.fillText(l.text, l.x, l.y); }

  // Bilder vorab laden
  const imgs = await Promise.all(scene.zones.map(zb => {
    const src = zoneImage(zb.z); if (!src || !IMAGE_PURPOSES.has(zb.z.purpose)) return null;
    return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  }));

  scene.zones.forEach((zb, i) => {
    const z = zb.z, bb = zb.bb;
    const x = bb.x + z.rx*bb.w, y = bb.y + z.ry*bb.h, w = z.rw*bb.w, h = z.rh*bb.h;
    if (IMAGE_PURPOSES.has(z.purpose)) {
      const im = imgs[i];
      if (im) {
        const r = Math.min(w/im.width, h/im.height);
        const dw = im.width*r, dh = im.height*r;
        ctx.drawImage(im, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
      }
      return;
    }
    const txt = zoneText(z); if (!txt) return;
    let fontPx = h*0.82*zoneSize(z);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `${zoneWeight(z)} ${fontPx}px "${zoneFont(z)}", sans-serif`;
    const maxW = w*0.94, m = ctx.measureText(txt);
    if (m.width > maxW) { fontPx *= maxW/m.width; ctx.font = `${zoneWeight(z)} ${fontPx}px "${zoneFont(z)}", sans-serif`; }
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#00000030"; ctx.lineWidth = fontPx*0.04; ctx.strokeText(txt, x+w/2, y+h/2);
    ctx.fillStyle = zoneColor(z); ctx.fillText(txt, x+w/2, y+h/2);
  });

  // Maßlinien
  for (const d of (scene.dims||[])) {
    const len = Math.hypot(d.x2-d.x1, d.y2-d.y1) || 1, ux=(d.x2-d.x1)/len, uy=(d.y2-d.y1)/len, px=-uy, py=ux, s=13;
    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(d.x1,d.y1); ctx.lineTo(d.x2,d.y2); ctx.stroke();
    const head = (tx,ty,dx,dy) => { ctx.beginPath();
      ctx.moveTo(tx-dx*s+px*s*0.55, ty-dy*s+py*s*0.55); ctx.lineTo(tx,ty); ctx.lineTo(tx-dx*s-px*s*0.55, ty-dy*s-py*s*0.55); ctx.stroke(); };
    head(d.x2,d.y2,ux,uy); head(d.x1,d.y1,-ux,-uy);
    const fs = 22, midX=(d.x1+d.x2)/2, midY=(d.y1+d.y2)/2, vertical = Math.abs(uy) > Math.abs(ux);
    ctx.save(); ctx.translate(midX + (vertical?-14:0), midY + (vertical?0:-13)); if (vertical) ctx.rotate(-Math.PI/2);
    ctx.font = `800 ${fs}px Inter, sans-serif`; const tw = ctx.measureText(d.label).width;
    ctx.fillStyle = "rgba(11,15,23,0.82)"; ctx.fillRect(-tw/2-7, -(fs+8)/2, tw+14, fs+8);
    ctx.fillStyle = "#8fbcff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(d.label, 0, 0);
    ctx.restore();
  }

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `${t.id}_gr${state.size}_${view === "sheet" ? "schnittbogen" : view}_druckdatei.png`;
  a.click();
}


/* =========================================================================
   INIT
   ========================================================================= */
function wireStage() {
  document.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => {
    state.view = b.dataset.view; state.selectedZoneId = null;
    updateSeg(); renderPreview(); if (state.tab === "zonen") renderPanel();
  }));
}
function updateSeg() {
  document.querySelectorAll(".seg").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
}

function init() {
  wireStage(); updateSeg();
  renderTabs(); renderPanel(); renderPreview();
  if (document.fonts) document.fonts.ready.then(renderPreview); // Fonts nachladen -> Preview auffrischen
}
init();
</script>
</body>
</html>
